<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>7살도 하는 코딩 놀이터</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { width: 400px; background: #222; padding: 25px; border-radius: 15px; border: 2px solid #00ffcc; text-align: center; }
        input, textarea { width: 90%; background: #000; color: #00ffcc; border: 1px solid #444; padding: 10px; margin: 5px 0; border-radius: 5px; }
        button { background: #ff0055; color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; }
        button:hover { background: #00ffcc; color: #000; }
        .post { background: #333; padding: 10px; margin-top: 10px; border-radius: 5px; text-align: left; }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="color:#00ffcc;">🎨 코딩 놀이터</h2>
        
        <div id="login-div">
            <input type="text" id="user-id" placeholder="아이디 적기"><br>
            <input type="password" id="user-pw" placeholder="비밀번호 적기"><br>
            <button onclick="login()">입장하기</button>
        </div>

        <div id="board-div" style="display:none;">
            <p>안녕, <b id="my-name" style="color:#00ffcc;"></b> 친구!</p>
            <input type="text" id="post-title" placeholder="웹페이지 제목"><br>
            <textarea id="post-code" placeholder="<h1>내용 작성</h1>" style="height:60px;"></textarea><br>
            <button onclick="savePost()">자랑하기</button>
            <div id="feed" style="max-height:150px; overflow-y:auto; margin-top:10px;"></div>
            <button onclick="location.reload()" style="background:#444; margin-top:10px;">나가기</button>
        </div>
    </div>

    <script>
        let myName = "";

        async function login() {
            let id = document.getElementById("user-id").value;
            let pw = document.getElementById("user-pw").value;
            if(!id) return alert("아이디를 적어주세요!");

            // 회원가입 시도 후 로그인
            await fetch('/api/signup', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id, pw}) });
            let res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id, pw}) });
            let data = await res.json();

            if(data.success) {
                myName = id;
                document.getElementById("login-div").style.display = "none";
                document.getElementById("board-div").style.display = "block";
                document.getElementById("my-name").innerText = myName;
                getPosts();
                setInterval(getPosts, 3000); // 3초마다 친구들 글 자동 새로고침!
            } else {
                alert("비밀번호가 틀렸어요!");
            }
        }

        async function savePost() {
            let title = document.getElementById("post-title").value;
            let code = document.getElementById("post-code").value;
            if(!title || !code) return alert("제목과 코드를 다 적어주세요!");

            await fetch('/api/posts', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ author: myName, title, code })
            });
            document.getElementById("post-title").value = "";
            document.getElementById("post-code").value = "";
            getPosts();
        }

        async function getPosts() {
            let res = await fetch('/api/posts');
            let posts = await res.json();
            let html = "";
            posts.forEach(p => {
                html += `<div class="post"><b>${p.author}</b>: ${p.title}</div>`;
            });
            document.getElementById("feed").innerHTML = html || "<small>아직 올라온 글이 없어요.</small>";
        }
    </script>
</body>
</html>
