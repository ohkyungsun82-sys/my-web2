<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ender Dash Multiplayer</title>
    <style>
        body { text-align: center; background: #111; color: white; font-family: sans-serif; margin-top: 50px; }
        .screen { display: none; }
        .active { display: block; }
        #gameContainer { display: none; position: relative; width: max-content; margin: 20px auto; border: 4px solid #444; }
        #gameArea { display: grid; background: #222; }
        .cell { width: 40px; height: 40px; box-sizing: border-box; }
        .wall { background: #555; border: 1px solid #333; }
        .floor { background: #add8e6; border: 1px solid #99c2d1; }
        .goal { background: #00ff00; }
        #player { width: 36px; height: 36px; background: #8a2be2; position: absolute; margin: 2px; transition: 0.15s linear; border-radius: 50%; z-index: 10; }
        .key-btn { font-size: 20px; padding: 10px 20px; margin: 5px; cursor: pointer; }
        input, select { padding: 8px; margin: 5px; }
    </style>
</head>
<body>
    <div id="authScreen" class="screen active">
        <h1>로그인 및 회원가입</h1>
        <input id="authId" placeholder="아이디"><br>
        <input id="authPw" type="password" placeholder="비밀번호"><br>
        <input id="authNick" placeholder="닉네임 (회원가입시)"><br><br>
        <button onclick="login()">로그인</button>
        <button onclick="register()">회원가입</button>
    </div>

    <div id="lobby" class="screen">
        <h1 id="welcomeMsg"></h1>
        <button onclick="logout()">로그아웃</button>
        <hr style="width:50%; margin:20px auto;">
        <input id="roomPw" type="password" placeholder="방 비밀번호"><br>
        <select id="maxPlayers">
            <option value="2">2인용</option>
            <option value="4">4인용</option>
        </select><br>
        <button onclick="createRoom()">방 만들기</button>
        <hr style="width:50%; margin:20px auto;">
        <input id="joinRoomId" placeholder="방 코드"><br>
        <input id="joinRoomPw" type="password" placeholder="방 비밀번호"><br>
        <button onclick="joinRoom()">참가하기</button>
    </div>

    <div id="room" class="screen">
        <h2 id="roomTitle">대기실</h2>
        <div id="playerList"></div>
        <div id="keySelector" style="margin-top:20px;">
            <button class="key-btn" id="btnW" onclick="selectKey('W')">W</button>
            <button class="key-btn" id="btnA" onclick="selectKey('A')">A</button>
            <button class="key-btn" id="btnS" onclick="selectKey('S')">S</button>
            <button class="key-btn" id="btnD" onclick="selectKey('D')">D</button>
        </div>
        <div id="myKeyDisplay" style="margin:20px; font-size:20px; color:#ffeb3b;"></div>
        <div id="gameContainer">
            <div id="gameArea"></div>
            <div id="player"></div>
            <h3 id="clearMsg" style="color:#0f0; display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:40px; text-shadow:2px 2px 0 #000; z-index:20;">클리어!</h3>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentRoomId = null;
        let pollInterval = null;
        let mapDrawn = false;

        async function sendRequest(data) {
            const res = await fetch('/api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            return await res.json();
        }

        async function register() {
            const res = await sendRequest({
                type: 'register',
                username: document.getElementById('authId').value,
                password: document.getElementById('authPw').value,
                nickname: document.getElementById('authNick').value
            });
            alert(res.message);
        }

        async function login() {
            const res = await sendRequest({
                type: 'login',
                username: document.getElementById('authId').value,
                password: document.getElementById('authPw').value
            });
            if (res.type === 'loginSuccess') {
                currentUser = res.user;
                showScreen('lobby');
                document.getElementById('welcomeMsg').innerText = `${currentUser.nickname}님 환영합니다!`;
            } else {
                alert(res.message);
            }
        }

        function logout() {
            currentUser = null;
            clearInterval(pollInterval);
            showScreen('authScreen');
        }

        async function createRoom() {
            const res = await sendRequest({
                type: 'createRoom',
                password: document.getElementById('roomPw').value,
                maxPlayers: document.getElementById('maxPlayers').value
            });
            if (res.type === 'roomCreated') {
                enterRoom(res.roomId);
            }
        }

        async function joinRoom() {
            const res = await sendRequest({
                type: 'joinRoom',
                roomId: document.getElementById('joinRoomId').value,
                password: document.getElementById('joinRoomPw').value,
                username: currentUser.username,
                nickname: currentUser.nickname
            });
            if (res.type === 'roomJoined') {
                enterRoom(res.room.roomId);
            } else {
                alert(res.message);
            }
        }

        function enterRoom(roomId) {
            currentRoomId = roomId;
            showScreen('room');
            mapDrawn = false;
            pollInterval = setInterval(pollRoom, 150);
        }

        async function selectKey(k) {
            await sendRequest({ type: 'selectKey', roomId: currentRoomId, username: currentUser.username, key: k });
        }

        window.addEventListener('keydown', async (e) => {
            if (currentRoomId) {
                const k = e.key.toUpperCase();
                if (['W','A','S','D'].includes(k)) {
                    await sendRequest({ type: 'move', roomId: currentRoomId, username: currentUser.username, key: k });
                }
            }
        });

        async function pollRoom() {
            const res = await sendRequest({ type: 'poll', roomId: currentRoomId });
            if (res.type === 'pollData') {
                updateUI(res.room, res.mapData);
            }
        }

        function updateUI(room, mapData) {
            document.getElementById('roomTitle').innerHTML = `방 코드: <b>${room.roomId}</b> (${room.players.length}/${room.maxPlayers})`;
            document.getElementById('playerList').innerHTML = room.players.map(p => `- ${p.nickname} (키: ${p.key || '선택 중'})`).join('<br>');
            
            const myPlayer = room.players.find(p => p.username === currentUser.username);
            if (myPlayer && myPlayer.key) {
                document.getElementById('myKeyDisplay').innerText = `내 담당 키: ${myPlayer.key}`;
                document.getElementById('keySelector').style.display = 'none';
            } else {
                document.getElementById('keySelector').style.display = 'block';
                ['W','A','S','D'].forEach(k => {
                    document.getElementById('btn'+k).disabled = room.assignedKeys.includes(k);
                });
            }

            if (room.gameState === 'playing' || room.gameState === 'clear') {
                document.getElementById('gameContainer').style.display = 'block';
                
                if (!mapDrawn) {
                    const ga = document.getElementById('gameArea');
                    ga.style.gridTemplateColumns = `repeat(${mapData[0].length}, 40px)`;
                    ga.innerHTML = '';
                    for (let y = 0; y < mapData.length; y++) {
                        for (let x = 0; x < mapData[y].length; x++) {
                            const d = document.createElement('div');
                            d.className = 'cell ' + (mapData[y][x] === 1 ? 'wall' : mapData[y][x] === 2 ? 'goal' : 'floor');
                            ga.appendChild(d);
                        }
                    }
                    mapDrawn = true;
                }

                const p = document.getElementById('player');
                p.style.left = (room.pos.x * 40) + 'px';
                p.style.top = (room.pos.y * 40) + 'px';

                if (room.gameState === 'clear') {
                    document.getElementById('clearMsg').style.display = 'block';
                }
            }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
