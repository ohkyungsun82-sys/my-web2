<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ender Dash</title>
    <style>
        body { font-family: 'Arial Black', sans-serif; background: #60a5fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .screen { display: none; background: #fff; border: 5px solid #000; border-radius: 20px; width: 450px; box-shadow: 0 10px 0 rgba(0,0,0,0.2); overflow: hidden; text-align: center; }
        .active { display: block; }
        .header { background: #93c5fd; border-bottom: 5px solid #000; padding: 15px; color: #fff; font-size: 26px; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }
        .content { padding: 25px; }
        h1, h2, h3 { margin: 10px 0; color: #333; }
        input { width: 85%; padding: 12px; margin: 8px 0; border: 4px solid #000; border-radius: 12px; font-size: 16px; font-weight: bold; outline: none; }
        button { background: #fff; border: 4px solid #000; border-radius: 12px; padding: 12px 24px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 #000; margin: 8px; transition: 0.1s; }
        button:active { transform: translateY(5px); box-shadow: 0 0 0 #000; }
        .btn-green { background: #4ade80; color: #fff; text-shadow: 1px 1px 0 #000; }
        .btn-blue { background: #60a5fa; color: #fff; text-shadow: 1px 1px 0 #000; }
        .btn-red { background: #f87171; color: #fff; text-shadow: 1px 1px 0 #000; }
        .settings-row { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 15px 0; font-size: 22px; }
        .stepper-btn { background: #60a5fa; color: #fff; width: 45px; height: 45px; padding: 0; display: flex; justify-content: center; align-items: center; text-shadow: 1px 1px 0 #000; }
        hr { border: 2px solid #000; border-radius: 2px; margin: 20px auto; width: 80%; }
        
        #publicRoomList { border: 3px solid #000; border-radius: 10px; max-height: 150px; overflow-y: auto; padding: 10px; background: #f3f4f6; text-align: left; margin: 10px auto; width: 90%; }
        .room-item { background: #fff; border: 2px solid #000; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .join-btn { padding: 5px 10px; font-size: 12px; margin: 0; background: #fbbf24; color: #000; text-shadow: none; }
        
        #gameArea { display: grid; background: #222; border: 5px solid #000; border-radius: 10px; margin: 15px auto; width: max-content; overflow: hidden; }
        .cell { width: 45px; height: 45px; box-sizing: border-box; }
        .wall { background: #555; border: 1px solid #333; }
        .floor { background: #add8e6; border: 1px solid #99c2d1; }
        .start { background: #facc15; border: 1px solid #ca8a04; }
        .goal { background: #4ade80; border: 1px solid #166534; }
        #player { width: 35px; height: 35px; background: #a855f7; position: absolute; margin: 5px; transition: 0.15s linear; border-radius: 50%; z-index: 10; border: 3px solid #000; box-sizing: border-box; }
        #gameContainer { display: none; position: relative; margin: 20px auto; }
        .key-btn { font-size: 24px; padding: 15px; width: 60px; height: 60px; }
        .overlay-msg { color:#4ade80; display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:45px; text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000; z-index:20; white-space: nowrap; }
        
        #chatArea { display: none; margin-top: 15px; border: 3px solid #000; border-radius: 10px; padding: 10px; background: #f0fdf4; text-align: left; height: 100px; overflow-y: auto; font-family: sans-serif; font-size: 14px;}
        #chatInputContainer { display: none; margin-top: 5px; }
        #chatInput { width: 70%; padding: 8px; border: 3px solid #000; border-radius: 8px; font-size: 14px;}
        .admin-btn { font-size: 12px; padding: 4px 8px; background: #f87171; color: white; border: 2px solid #000; margin-left: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="loginScreen" class="screen active">
        <div class="header">LOGIN</div>
        <div class="content">
            <input id="loginId" placeholder="아이디">
            <input id="loginPw" type="password" placeholder="비밀번호">
            <br>
            <button class="btn-green" onclick="login()">로그인</button>
            <button class="btn-blue" onclick="showScreen('registerScreen')">회원가입</button>
        </div>
    </div>

    <div id="registerScreen" class="screen">
        <div class="header">REGISTER</div>
        <div class="content">
            <input id="regId" placeholder="아이디">
            <input id="regPw" type="password" placeholder="비밀번호">
            <input id="regNick" placeholder="닉네임">
            <br>
            <button class="btn-green" onclick="register()">가입하기</button>
            <button class="btn-red" onclick="showScreen('loginScreen')">취소</button>
        </div>
    </div>

    <div id="lobby" class="screen" style="width: 500px;">
        <div class="header">GAME SETTINGS</div>
        <div class="content">
            <h2 id="welcomeMsg"></h2>
            <button class="btn-red" style="padding: 8px 16px; font-size: 14px;" onclick="logout()">로그아웃</button>
            <hr>
            <h3>방 만들기</h3>
            <div class="settings-row">
                <button class="stepper-btn" onclick="changePlayers(-1)">-</button>
                <span id="maxPlayersLabel">2</span>인용
                <button class="stepper-btn" onclick="changePlayers(1)">+</button>
            </div>
            <div style="margin:10px;">
                <label style="font-size: 18px; cursor:pointer;">
                    <input type="checkbox" id="isPublic" checked style="width:auto; transform:scale(1.5); margin-right:10px;"> 
                    공개 방으로 만들기 (비번 없음)
                </label>
            </div>
            <input id="roomPw" type="password" placeholder="비밀번호 (비공개시)" style="display:none;">
            <button class="btn-green" style="width: 85%;" onclick="createRoom()">방 만들기</button>
            
            <hr>
            <h3>공개 방 리스트 <button onclick="fetchRoomList()" style="padding:5px 10px; font-size:12px; background:#e5e7eb;">새로고침</button></h3>
            <div id="publicRoomList">
                방이 없습니다.
            </div>

            <hr>
            <h3>비공개 방 참가</h3>
            <input id="joinRoomId" placeholder="방 코드">
            <input id="joinRoomPw" type="password" placeholder="비밀번호">
            <button class="btn-blue" style="width: 85%;" onclick="joinRoomByInput()">코드 참가</button>
        </div>
    </div>

    <div id="room" class="screen" style="width: 550px;">
        <div class="header" id="roomTitle">ROOM</div>
        <div class="content">
            <h3 id="roomPwDisplay" style="color: #ef4444;"></h3>
            <button class="btn-red" onclick="leaveRoom()">나가기</button>
            
            <div id="playerList" style="margin: 15px 0; font-size: 18px;"></div>
            
            <div id="keySelector">
                <p id="keyGuide" style="color: #3b82f6; font-size: 18px;"></p>
                <div>
                    <button class="key-btn" id="btnW" onclick="selectKey('W')">W</button>
                </div>
                <div>
                    <button class="key-btn" id="btnA" onclick="selectKey('A')">A</button>
                    <button class="key-btn" id="btnS" onclick="selectKey('S')">S</button>
                    <button class="key-btn" id="btnD" onclick="selectKey('D')">D</button>
                </div>
            </div>
            <div id="myKeyDisplay" style="margin:10px; font-size:22px; color:#10b981;"></div>
            
            <h2 id="stageDisplay" style="display:none; color: #f59e0b;"></h2>
            
            <div id="gameContainer">
                <div id="gameArea"></div>
                <div id="player"></div>
                <h3 id="clearMsg" class="overlay-msg">CLEAR!</h3>
                <h3 id="allClearMsg" class="overlay-msg" style="color:#facc15;">ALL CLEAR!</h3>
            </div>

            <div id="chatArea"></div>
            <div id="chatInputContainer">
                <input id="chatInput" placeholder="채팅 입력..." onkeypress="handleChat(event)">
                <button class="btn-blue" style="padding: 6px 12px; font-size:14px; width:auto;" onclick="sendChat()">전송</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentRoomId = null;
        let pollInterval = null;
        let listInterval = null;
        let currentStage = -1;
        
        let allowedPlayers = [1, 2, 4];
        let pIndex = 1;

        window.onload = () => {
            const saved = localStorage.getItem('gameUser');
            if (saved) {
                currentUser = JSON.parse(saved);
                document.getElementById('welcomeMsg').innerText = `${currentUser.nickname}님!`;
                showLobby();
            }
            
            // 공개방 체크박스 연동
            document.getElementById('isPublic').addEventListener('change', (e) => {
                if (allowedPlayers[pIndex] !== 1) {
                    document.getElementById('roomPw').style.display = e.target.checked ? 'none' : 'inline-block';
                }
            });
        };

        async function sendRequest(data) {
            const res = await fetch('/api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            return await res.json();
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showLobby() {
            showScreen('lobby');
            fetchRoomList();
            clearInterval(listInterval);
            listInterval = setInterval(fetchRoomList, 3000); // 3초마다 방 목록 갱신
        }

        function changePlayers(dir) {
            pIndex += dir;
            if (pIndex < 0) pIndex = 0;
            if (pIndex > 2) pIndex = 2;
            document.getElementById('maxPlayersLabel').innerText = allowedPlayers[pIndex];
            
            if (allowedPlayers[pIndex] === 1) {
                document.getElementById('isPublic').checked = false;
                document.getElementById('isPublic').parentElement.style.display = 'none';
                document.getElementById('roomPw').style.display = 'none';
            } else {
                document.getElementById('isPublic').parentElement.style.display = 'block';
                document.getElementById('roomPw').style.display = document.getElementById('isPublic').checked ? 'none' : 'inline-block';
            }
        }

        async function register() {
            const res = await sendRequest({
                type: 'register',
                username: document.getElementById('regId').value,
                password: document.getElementById('regPw').value,
                nickname: document.getElementById('regNick').value
            });
            if (res.type === 'success') {
                currentUser = res.user;
                localStorage.setItem('gameUser', JSON.stringify(currentUser));
                document.getElementById('welcomeMsg').innerText = `${currentUser.nickname}님!`;
                showLobby();
            } else {
                alert(res.message);
            }
        }

        async function login() {
            const res = await sendRequest({
                type: 'login',
                username: document.getElementById('loginId').value,
                password: document.getElementById('loginPw').value
            });
            if (res.type === 'loginSuccess') {
                currentUser = res.user;
                localStorage.setItem('gameUser', JSON.stringify(currentUser));
                document.getElementById('welcomeMsg').innerText = `${currentUser.nickname}님!`;
                showLobby();
            } else {
                alert(res.message);
            }
        }

        function logout() {
            localStorage.removeItem('gameUser');
            currentUser = null;
            clearInterval(listInterval);
            showScreen('loginScreen');
        }

        // 방 목록 불러오기
        async function fetchRoomList() {
            if (document.getElementById('lobby').classList.contains('active')) {
                const res = await sendRequest({ type: 'getRoomList' });
                if (res.type === 'roomList') {
                    const listDiv = document.getElementById('publicRoomList');
                    if (res.list.length === 0) {
                        listDiv.innerHTML = '<div style="text-align:center; padding:10px;">방이 없습니다.</div>';
                    } else {
                        listDiv.innerHTML = res.list.map(r => `
                            <div class="room-item">
                                <div><b>${r.host}</b>의 방 (${r.currentPlayers}/${r.maxPlayers})</div>
                                <button class="join-btn" onclick="joinRoomDirect('${r.roomId}')">참가</button>
                            </div>
                        `).join('');
                    }
                }
            }
        }

        async function createRoom() {
            const isPublic = document.getElementById('isPublic').checked;
            const res = await sendRequest({
                type: 'createRoom',
                username: currentUser.username,
                nickname: currentUser.nickname,
                password: isPublic ? '' : document.getElementById('roomPw').value,
                isPublic: isPublic,
                maxPlayers: allowedPlayers[pIndex]
            });
            if (res.type === 'roomCreated') enterRoom(res.roomId);
        }

        async function joinRoomByInput() {
            joinRoomLogic(document.getElementById('joinRoomId').value, document.getElementById('joinRoomPw').value);
        }

        async function joinRoomDirect(roomId) {
            joinRoomLogic(roomId, ''); // 공개방은 비번 없음
        }

        async function joinRoomLogic(roomId, password) {
            const res = await sendRequest({
                type: 'joinRoom',
                roomId: roomId,
                password: password || '없음',
                username: currentUser.username,
                nickname: currentUser.nickname
            });
            if (res.type === 'roomJoined') enterRoom(res.room.roomId);
            else alert(res.message);
        }

        function enterRoom(roomId) {
            currentRoomId = roomId;
            currentStage = -1;
            clearInterval(listInterval); // 로비 새로고침 중지
            document.getElementById('chatArea').style.display = 'block';
            document.getElementById('chatInputContainer').style.display = 'block';
            showScreen('room');
            pollInterval = setInterval(pollRoom, 150);
        }

        async function leaveRoom() {
            await sendRequest({ type: 'leaveRoom', roomId: currentRoomId, username: currentUser.username });
            clearInterval(pollInterval);
            currentRoomId = null;
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('chatArea').style.display = 'none';
            document.getElementById('chatInputContainer').style.display = 'none';
            showLobby();
        }

        async function selectKey(k) {
            await sendRequest({ type: 'selectKey', roomId: currentRoomId, username: currentUser.username, key: k });
        }

        window.addEventListener('keydown', async (e) => {
            if (document.activeElement === document.getElementById('chatInput')) return;

            if (currentRoomId) {
                const k = e.key.toUpperCase();
                if (['W','A','S','D'].includes(k)) {
                    await sendRequest({ type: 'move', roomId: currentRoomId, username: currentUser.username, key: k });
                }
            }
        });

        async function sendChat() {
            const msg = document.getElementById('chatInput').value;
            if (msg.trim() !== '') {
                await sendRequest({ type: 'chat', roomId: currentRoomId, nickname: currentUser.nickname, message: msg });
                document.getElementById('chatInput').value = '';
            }
        }

        function handleChat(e) {
            if (e.key === 'Enter') sendChat();
        }

        async function kickPlayer(targetUsername) {
            await sendRequest({ type: 'kick', roomId: currentRoomId, username: currentUser.username, nickname: currentUser.nickname, targetUsername });
        }

        async function pollRoom() {
            const res = await sendRequest({ type: 'poll', roomId: currentRoomId, username: currentUser.username });
            if (res.type === 'pollData') {
                updateUI(res.room);
            } else if (res.type === 'kicked') {
                alert('방에서 강퇴당했습니다.');
                leaveRoom();
            } else if (res.type === 'error') {
                leaveRoom();
            }
        }

        function updateUI(room) {
            document.getElementById('roomTitle').innerText = `CODE : ${room.roomId} (${room.players.length}/${room.maxPlayers})`;
            document.getElementById('roomPwDisplay').innerText = room.password !== '없음' ? `비밀번호: ${room.password}` : '비밀번호 없음 (공개)';
            
            const isAdmin = currentUser.username === '이윤호' || currentUser.nickname === '이윤호';
            
            document.getElementById('playerList').innerHTML = room.players.map(p => {
                let btn = (isAdmin && p.username !== currentUser.username) ? `<button class="admin-btn" onclick="kickPlayer('${p.username}')">강퇴</button>` : '';
                return `${p.nickname} [${p.keys.length > 0 ? p.keys.join(',') : '대기중'}] ${btn}`;
            }).join('<br>');
            
            const myPlayer = room.players.find(p => p.username === currentUser.username);
            const keyLimit = 4 / room.maxPlayers;
            
            document.getElementById('keyGuide').innerText = `1인당 ${keyLimit}개의 키 선택`;
            
            if (myPlayer && myPlayer.keys.length > 0) {
                document.getElementById('myKeyDisplay').innerText = `내 조작키: ${myPlayer.keys.join(', ')}`;
            }

            if (myPlayer && myPlayer.keys.length >= keyLimit) {
                document.getElementById('keySelector').style.display = 'none';
            } else {
                document.getElementById('keySelector').style.display = 'block';
                ['W','A','S','D'].forEach(k => {
                    document.getElementById('btn'+k).disabled = room.assignedKeys.includes(k);
                });
            }

            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = room.chat.map(c => `<b>${c.nickname}</b>: ${c.message}`).join('<br>');
            chatArea.scrollTop = chatArea.scrollHeight;

            if (room.gameState === 'playing' || room.gameState === 'clear' || room.gameState === 'allClear') {
                document.getElementById('gameContainer').style.display = 'block';
                document.getElementById('stageDisplay').style.display = 'block';
                document.getElementById('stageDisplay').innerText = `STAGE ${room.stage + 1}`;
                
                if (currentStage !== room.stage && room.mapData.length > 0) {
                    const ga = document.getElementById('gameArea');
                    ga.style.gridTemplateColumns = `repeat(${room.mapData[0].length}, 45px)`;
                    ga.innerHTML = '';
                    for (let y = 0; y < room.mapData.length; y++) {
                        for (let x = 0; x < room.mapData[y].length; x++) {
                            const d = document.createElement('div');
                            let type = 'floor';
                            if(room.mapData[y][x]===1) type = 'wall';
                            if(room.mapData[y][x]===2) type = 'goal';
                            if(room.mapData[y][x]===3) type = 'start';
                            d.className = 'cell ' + type;
                            ga.appendChild(d);
                        }
                    }
                    currentStage = room.stage;
                }

                const p = document.getElementById('player');
                p.style.left = (room.pos.x * 45) + 'px';
                p.style.top = (room.pos.y * 45) + 'px';

                document.getElementById('clearMsg').style.display = room.gameState === 'clear' ? 'block' : 'none';
                document.getElementById('allClearMsg').style.display = room.gameState === 'allClear' ? 'block' : 'none';
            } else {
                document.getElementById('gameContainer').style.display = 'none';
                document.getElementById('stageDisplay').style.display = 'none';
            }
        }
    </script>
</body>
</html>
