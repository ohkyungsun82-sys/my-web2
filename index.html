<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>팀워크 얼음 퍼즐</title>
    <style>
        body { text-align: center; background: #111; color: white; font-family: sans-serif; margin-top: 50px; }
        .screen { display: none; }
        .active { display: block; }
        #board { width: 400px; height: 400px; background: #222; margin: 20px auto; position: relative; border: 4px solid #444; }
        #player { width: 40px; height: 40px; background: #ff4757; position: absolute; border-radius: 50%; transition: 0.1s; }
        .key-btn { font-size: 20px; padding: 10px 20px; margin: 5px; cursor: pointer; }
        input, select { padding: 8px; margin: 5px; }
    </style>
</head>
<body>

    <div id="authScreen" class="screen active">
        <h1>로그인 및 회원가입</h1>
        <input id="authId" placeholder="아이디"><br>
        <input id="authPw" type="password" placeholder="비밀번호"><br>
        <input id="authNick" placeholder="닉네임 (회원가입시)"><br><br>
        <button onclick="login()">로그인</button>
        <button onclick="register()">회원가입</button>
    </div>

    <div id="lobby" class="screen">
        <h1 id="welcomeMsg">환영합니다!</h1>
        <button onclick="logout()">로그아웃</button>
        <hr style="width:50%; margin:20px auto;">
        <h3>방 만들기</h3>
        <input id="roomPw" type="password" placeholder="방 비밀번호"><br>
        <select id="maxPlayers">
            <option value="2">2인용</option>
            <option value="4">4인용</option>
        </select><br>
        <button onclick="createRoom()">방 만들기</button>
        <hr style="width:50%; margin:20px auto;">
        <h3>방 들어가기</h3>
        <input id="joinRoomId" placeholder="방 코드"><br>
        <input id="joinRoomPw" type="password" placeholder="방 비밀번호"><br>
        <button onclick="joinRoom()">참가하기</button>
    </div>

    <div id="room" class="screen">
        <h2>대기실</h2>
        <div id="inviteArea"></div>
        <div id="playerList"></div>
        <div id="keySelector" style="margin-top:20px;">
            <h3>담당할 키를 고르세요</h3>
            <button class="key-btn" id="btnW" onclick="selectKey('W')">W</button>
            <button class="key-btn" id="btnA" onclick="selectKey('A')">A</button>
            <button class="key-btn" id="btnS" onclick="selectKey('S')">S</button>
            <button class="key-btn" id="btnD" onclick="selectKey('D')">D</button>
        </div>
    </div>

    <div id="game" class="screen">
        <h2 id="myAssignedKey">내 키: 없음</h2>
        <div id="board">
            <div id="player"></div>
        </div>
    </div>

    <script>
        const ws = new WebSocket(`ws://${location.host}`);
        let currentUser = null;
        let myKey = null;

        ws.onopen = () => {
            const savedUser = localStorage.getItem('gameUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showScreen('lobby');
                document.getElementById('welcomeMsg').innerText = `${currentUser.nickname}님 환영합니다!`;
                
                const urlParams = new URLSearchParams(window.location.search);
                const autoRoom = urlParams.get('room');
                if (autoRoom) document.getElementById('joinRoomId').value = autoRoom;
            }
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'success' || data.type === 'error') {
                alert(data.message);
            } else if (data.type === 'loginSuccess') {
                currentUser = data.user;
                localStorage.setItem('gameUser', JSON.stringify(currentUser));
                showScreen('lobby');
                document.getElementById('welcomeMsg').innerText = `${currentUser.nickname}님 환영합니다!`;
            } else if (data.type === 'roomCreated' || data.type === 'roomJoined') {
                showScreen('room');
            } else if (data.type === 'update') {
                updateUI(data.room);
            }
        };

        function register() {
            ws.send(JSON.stringify({
                type: 'register',
                username: document.getElementById('authId').value,
                password: document.getElementById('authPw').value,
                nickname: document.getElementById('authNick').value
            }));
        }

        function login() {
            ws.send(JSON.stringify({
                type: 'login',
                username: document.getElementById('authId').value,
                password: document.getElementById('authPw').value
            }));
        }

        function logout() {
            localStorage.removeItem('gameUser');
            currentUser = null;
            showScreen('authScreen');
        }

        function createRoom() {
            ws.send(JSON.stringify({
                type: 'createRoom',
                password: document.getElementById('roomPw').value,
                maxPlayers: document.getElementById('maxPlayers').value
            }));
        }

        function joinRoom() {
            ws.send(JSON.stringify({
                type: 'joinRoom',
                roomId: document.getElementById('joinRoomId').value,
                password: document.getElementById('joinRoomPw').value
            }));
        }

        function selectKey(key) {
            myKey = key;
            ws.send(JSON.stringify({ type: 'selectKey', key }));
            document.getElementById('keySelector').style.display = 'none';
            document.getElementById('myAssignedKey').innerText = `내 담당 키: ${key}`;
        }

        window.addEventListener('keydown', (e) => {
            const k = e.key.toUpperCase();
            if (k === myKey) ws.send(JSON.stringify({ type: 'move', key: k }));
        });

        function updateUI(room) {
            if (room.gameState === 'playing') {
                showScreen('game');
                const p = document.getElementById('player');
                p.style.left = (room.pos.x * 40) + 'px';
                p.style.top = (room.pos.y * 40) + 'px';
            }

            const inviteLink = `${location.origin}${location.pathname}?room=${room.roomId || ''}`;
            document.getElementById('inviteArea').innerHTML = `
                방 코드: <b>${room.roomId || ''}</b><br>
                초대 링크: <input type="text" value="${inviteLink}" readonly style="width:250px;" onclick="this.select()">
                <p style="font-size:12px; color:#aaa;">(링크를 복사해서 주거나 스마트폰으로 주소 접속 가능)</p>
            `;

            const list = document.getElementById('playerList');
            list.innerHTML = `참가자:<br>` + room.players.map(p => `- ${p.nickname} (${p.key ? '키: ' + p.key : '선택 중'})`).join('<br>');

            room.assignedKeys.forEach(k => {
                const btn = document.getElementById('btn' + k);
                if (btn) btn.disabled = true;
            });
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
