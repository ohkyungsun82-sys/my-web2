<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>다함께 클릭 게임</title>
    <style>
        body { text-align: center; font-family: sans-serif; margin-top: 100px; }
        #score { font-size: 80px; font-weight: bold; color: #ff4757; margin: 30px; }
        #btn { font-size: 30px; padding: 20px 50px; cursor: pointer; border: none; background: #2ed573; color: white; border-radius: 10px; }
        #btn:active { background: #25a15a; }
    </style>
</head>
<body>
    <h1>친구들과 점수 올리기!</h1>
    <div id="score">0</div>
    <button id="btn">클릭!</button>

    <script>
        const ws = new WebSocket("ws://localhost:8080");
        const scoreDiv = document.getElementById("score");
        const btn = document.getElementById("btn");

        ws.onmessage = (event) => {
            scoreDiv.innerText = event.data;
        };

        btn.onclick = () => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send("click");
            }
        };
    </script>
</body>
</html>
